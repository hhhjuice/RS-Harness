[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-harness"
version = "0.2.1"
description = "A minimal model-backed harness for remote-sensing analysis agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "socksio>=1.0,<2",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]

[project.scripts]
rsh = "rs_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
