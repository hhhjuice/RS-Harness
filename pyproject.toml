[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-harness"
version = "0.0.5"
description = "A LangChain-based agent harness with persistent sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14,<2",
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph-checkpoint-sqlite>=2.0,<4",
    "pydantic>=2.7,<3",
    "prompt-toolkit>=3.0.52,<4",
    "typer>=0.12,<1",
]

[project.scripts]
rsh = "rs_harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not live'"
asyncio_mode = "auto"
markers = [
    "live: requires a configured real model and network access",
]
