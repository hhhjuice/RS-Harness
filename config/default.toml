[model]
model = "gpt-5.6-luna"
base_url = "https://juiceai.cloud/v1"                          # empty uses the SDK default endpoint
api_key_env = "OPENAI_API_KEY"
timeout_s = 60
max_tokens = 4096

[loop]
max_turns = 1

[runtime]
sessions_dir = "../sessions"
system_prompt_file = "../prompts/system.md"
dotenv_file = "../.env"
