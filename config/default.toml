[model]
model = "deepseek-v4-flash-vision-exp"
base_url = "https://api.deepseek.com"                          # empty uses the SDK default endpoint
api_key_env = "OPENAI_API_KEY"
timeout_s = 60
max_tokens = 4096

[loop]
max_turns = 20
bash_timeout_s = 120

[runtime]
sessions_dir = "../sessions"
system_prompt_file = "../prompts/system.md"
dotenv_file = "../.env"
